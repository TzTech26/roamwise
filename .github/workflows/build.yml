name: Build

on:
  push:
    branches: [main, update-fixes]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Tags like v1.2.0 set the version the app reports and compares against when it checks for updates.
      - name: Version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          "VERSION_ARG=$(if ($v) { "-p:Version=$v" })" >> $env:GITHUB_ENV

      - name: Publish
        run: dotnet publish src/Roamwise/Roamwise.csproj -c Release -r ${{ matrix.rid }} -o out/${{ matrix.rid }} ${{ env.VERSION_ARG }}

      # Releases are signed in the sign job; this copy is for trying a build.
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.rid }}
          path: |
            out/${{ matrix.rid }}/Roamwise.exe
            README.md
            LICENSE

  # Signs the Windows exes through SignPath (free signing for open source, certificate by SignPath Foundation) so
  # Smart App Control and SmartScreen trust them. Needs the SIGNPATH_API_TOKEN secret and SIGNPATH_* variables
  # (see docs/signing.md); without them the release goes out unsigned, as before.
  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.setup.outputs.ready }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-*

      - name: Check for signing setup
        id: setup
        shell: pwsh
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $ready = [bool]$env:TOKEN -and [bool]'${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          "ready=$($ready.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $ready) { "::warning::SignPath isn't set up, so the Windows release is unsigned." }
          # One artifact holding both exes, laid out the way the SignPath artifact configuration expects.
          foreach ($rid in 'win-x64', 'win-arm64') {
            New-Item -ItemType Directory -Force "to-sign/$rid" | Out-Null
            Copy-Item "unsigned-$rid/out/$rid/Roamwise.exe" "to-sign/$rid/Roamwise.exe"
          }

      - name: Upload for signing
        id: upload
        if: steps.setup.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: to-sign
          path: to-sign/

      # Release signing needs an approver to confirm the request in SignPath; this waits up to an hour for that.
      - name: Sign
        if: steps.setup.outputs.ready == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Check signatures
        if: steps.setup.outputs.ready == 'true'
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            $s = Get-AuthenticodeSignature "signed/$rid/Roamwise.exe"
            "$rid : $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "$rid isn't signed" }
            Copy-Item "signed/$rid/Roamwise.exe" "to-sign/$rid/Roamwise.exe" -Force
          }

      - name: Zip
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            Compress-Archive -Path "to-sign/$rid/Roamwise.exe", "unsigned-$rid/README.md", "unsigned-$rid/LICENSE" -DestinationPath "Roamwise-$rid.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Roamwise-windows
          path: Roamwise-win-*.zip

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "VERSION_ARG=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi

      - name: Build AppImage
        run: |
          sudo apt-get update -q && sudo apt-get install -yq file
          bash tools/build-appimage.sh ${{ matrix.rid }} $VERSION_ARG

      # The Wi-Fi code against mock NetworkManager and wpa_supplicant services on a private bus.
      - name: Test against mock services
        run: |
          sudo apt-get install -yq python3-dbusmock dbus-x11
          bash tests/linux/run.sh out/${{ matrix.rid }}/roamwise

      - uses: actions/upload-artifact@v4
        with:
          name: Roamwise-${{ matrix.rid }}
          path: Roamwise-${{ matrix.rid }}.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sign, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Roamwise-*
          merge-multiple: true

      # The in-app updater refuses to install a download whose hash isn't listed here.
      - name: Checksums
        run: sha256sum Roamwise-*.zip Roamwise-*.AppImage > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Roamwise-*.zip
            Roamwise-*.AppImage
            SHA256SUMS.txt
          # The code signing policy has to be mentioned where people download signed builds.
          body: ${{ needs.sign.outputs.signed == 'true' && 'Windows builds: free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org). See the [code signing policy](https://github.com/TzTech26/roamwise#code-signing-policy).' || '' }}
          generate_release_notes: true
