name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/Roamwise/Roamwise.csproj -c Release -r ${{ matrix.rid }} -o out/${{ matrix.rid }}

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/${{ matrix.rid }}/Roamwise.exe, README.md, LICENSE -DestinationPath Roamwise-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Roamwise-${{ matrix.rid }}
          path: Roamwise-${{ matrix.rid }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: Roamwise-*.zip
          generate_release_notes: true
